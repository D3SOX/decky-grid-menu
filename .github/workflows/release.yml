name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - name: Verify release version
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          bun run - >> "$GITHUB_OUTPUT" <<'JS'
          const { version } = await Bun.file("package.json").json();
          if (process.env.RELEASE_TAG !== `v${version}`) {
            throw new Error("Release tag must match the package.json version");
          }
          console.log(`zip=out/decky-grid-menu-${version}.zip`);
          JS

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check source
        run: |
          bun run typecheck
          bun run lint
          bun test

      - name: Build and package
        run: |
          bun run build
          bun run package

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_ZIP: ${{ steps.version.outputs.zip }}
        run: |
          gh release create "$RELEASE_TAG" "$RELEASE_ZIP" \
            --verify-tag \
            --title "Grid Menu $RELEASE_TAG" \
            --generate-notes \
            --notes "Download the attached decky-grid-menu ZIP and install it using Decky's Install Plugin from ZIP option."
